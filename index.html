<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Members Portal</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="header-inner">
      <div class="logo-area">
        <svg class="logo-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="40" height="40" rx="8" fill="white" fill-opacity="0.15"/>
          <path d="M10 20 L20 10 L30 20 L20 30 Z" fill="white"/>
          <circle cx="20" cy="20" r="4" fill="white" fill-opacity="0.6"/>
        </svg>
        <span class="logo-text" id="site-brand"></span>
      </div>
      <div class="header-text">
        <h1 class="portal-title" id="site-title"></h1>
        <p class="portal-tagline" id="site-tagline"></p>
      </div>
    </div>
  </header>

  <!-- SEARCH + NAV -->
  <div class="search-nav-bar">
    <div class="search-nav-inner">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="9" cy="9" r="6" stroke="#94a3b8" stroke-width="1.5"/>
          <path d="M13.5 13.5 L17 17" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <input type="text" id="search-input" class="search-input" placeholder="Search guides, prompts, frameworks..." />
      </div>
      <nav class="pill-nav" id="pill-nav"></nav>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <main class="main-content" id="main-content"></main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <p id="site-footer"></p>
  </footer>

  <!-- Load content config first, then render -->
  <script src="content.js"></script>
  <script>

    // ── Helpers ──────────────────────────────────────────────

    function el(tag, cls, html) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (html !== undefined) e.innerHTML = html;
      return e;
    }

    function badgeClass(style) {
      const map = { ai: 'engine-badge--ai', ref: 'engine-badge--ref', muted: 'engine-badge--muted' };
      return 'engine-badge ' + (map[style] || '');
    }

    function linkClass(style) {
      const map = { outline: 'link-btn link-btn--outline', disabled: 'link-btn link-btn--disabled' };
      return map[style] || 'link-btn';
    }

    // ── Render site meta ─────────────────────────────────────

    document.title = SITE.brand + ' — Members Portal';
    document.getElementById('site-brand').textContent   = SITE.brand;
    document.getElementById('site-title').textContent   = SITE.title;
    document.getElementById('site-tagline').textContent = SITE.tagline;
    document.getElementById('site-footer').textContent  = SITE.footer;

    // ── Render nav pills ─────────────────────────────────────

    const nav = document.getElementById('pill-nav');
    NAV_PILLS.forEach(pill => {
      const a = el('a', 'pill', pill.label);
      a.href = pill.href;
      nav.appendChild(a);
    });

    // ── Render sections & cards ──────────────────────────────

    const main = document.getElementById('main-content');

    SECTIONS.forEach(section => {
      const sec = el('section', 'section');
      sec.id = section.id;

      // Section header
      const hdr = el('div', 'section-header');
      hdr.appendChild(el('h2', 'section-title', section.title));

      if (section.badge) {
        hdr.appendChild(el('span', badgeClass(section.badgeStyle).trim(), section.badge));
      }

      if (section.overviewLink) {
        const ov = el('a', 'overview-link', 'Overview Guide →');
        ov.href = section.overviewLink;
        hdr.appendChild(ov);
      }

      sec.appendChild(hdr);

      // Card grid
      const grid = el('div', 'card-grid');

      section.cards.forEach(card => {
        const c = el('div', 'card' + (card.comingSoon ? ' card--coming-soon' : ''));
        c.dataset.tags = card.tags || '';

        // Label row
        const labelRow = el('div', 'card-label', card.label);
        if (card.comingSoon) {
          labelRow.appendChild(el('span', 'badge-coming-soon', 'Coming Soon'));
        }
        c.appendChild(labelRow);

        c.appendChild(el('h3', 'card-title', card.title));
        c.appendChild(el('p',  'card-desc',  card.desc));

        // Links
        const linkRow = el('div', 'card-links');
        card.links.forEach(link => {
          const cls = linkClass(link.style);
          if (link.style === 'disabled') {
            linkRow.appendChild(el('span', cls, link.text));
          } else {
            const a = el('a', cls, link.text);
            a.href = link.href;
            linkRow.appendChild(a);
          }
        });
        c.appendChild(linkRow);

        grid.appendChild(c);
      });

      sec.appendChild(grid);
      main.appendChild(sec);
    });

    // ── Render coaching CTA ──────────────────────────────────

    const cta = el('div', 'coaching-cta');
    const ctaInner = el('div', 'coaching-cta-inner');
    const ctaText = el('div');
    ctaText.appendChild(el('p', 'coaching-cta-title', COACHING_CTA.title));
    ctaText.appendChild(el('p', 'coaching-cta-desc',  COACHING_CTA.desc));
    const ctaBtn = el('a', 'cta-btn', COACHING_CTA.btnText);
    ctaBtn.href = COACHING_CTA.btnHref;
    ctaInner.appendChild(ctaText);
    ctaInner.appendChild(ctaBtn);
    cta.appendChild(ctaInner);
    main.appendChild(cta);

    // ── Search ───────────────────────────────────────────────

    document.getElementById('search-input').addEventListener('input', function () {
      const q = this.value.toLowerCase().trim();

      document.querySelectorAll('.card').forEach(card => {
        const text = [
          card.querySelector('.card-title')?.textContent,
          card.querySelector('.card-desc')?.textContent,
          card.querySelector('.card-label')?.textContent,
          card.dataset.tags,
        ].join(' ').toLowerCase();
        card.style.display = (!q || text.includes(q)) ? '' : 'none';
      });

      document.querySelectorAll('.section').forEach(sec => {
        const visible = [...sec.querySelectorAll('.card')].some(c => c.style.display !== 'none');
        sec.style.display = (!q || visible) ? '' : 'none';
      });
    });

  </script>
</body>
</html>
